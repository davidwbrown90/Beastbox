workflows:
  ios-workflow:
    name: Beast Box iOS
    integrations:
      # Name of the API key connected under Codemagic → Team settings →
      # Integrations → Developer Portal. Set this up once there (it asks
      # for the same Issuer ID / Key ID / .p8 private key from App Store
      # Connect → Users and Access → Integrations → App Store Connect API),
      # give the key this exact name, and it can be reused across workflows
      # without pasting the private key into environment variables.
      app_store_connect: "Beast Box"
    environment:
      vars:
        BUNDLE_ID: "com.beastbox.game" # matches capacitor.config.json
        XCODE_PROJECT: "ios/App/App.xcodeproj" # project, not workspace -- SPM, no CocoaPods here
        XCODE_SCHEME: "App"
        # APP_STORE_APPLE_ID: 0000000000 # fill in once the app record exists
        # in App Store Connect (App Store Connect → App → General → App
        # Information → Apple ID) -- not needed for the first build, only
        # for the build-number-lookup step below once that app exists.
      node: latest
      xcode: latest # pin to a specific version (e.g. 15.0) once a build succeeds, to avoid surprise Xcode updates breaking things later
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "master"
          include: true
          source: true
    scripts:
      - name: Install web dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor (copies dist/ into the native iOS project)
        script: |
          npx cap sync ios
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on the Xcode project
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Starts false on purpose -- confirm the .ipa actually builds and
        # signs correctly first, then flip to true once you're ready to
        # have every successful build land in TestFlight automatically.
        submit_to_testflight: false
