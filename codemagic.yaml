workflows:
  ios-workflow:
    name: Beast Box iOS
    environment:
      groups:
        # Create this group in Codemagic UI → Team settings → Environment
        # variable groups, named exactly "app_store_credentials", containing:
        #   APP_STORE_CONNECT_ISSUER_ID
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY
        # All three come from App Store Connect → Users and Access →
        # Integrations → App Store Connect API (create a key with "App
        # Manager" access). See docs.codemagic.io/code-signing-yaml/signing-ios/
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.beastbox.game" # matches capacitor.config.json
        XCODE_PROJECT: "ios/App/App.xcodeproj" # project, not workspace -- SPM, no CocoaPods here
        XCODE_SCHEME: "App"
        # APP_STORE_APPLE_ID: 0000000000 # fill in once the app record exists
        # in App Store Connect (App Store Connect → App → General → App
        # Information → Apple ID) -- not needed for the first build, only
        # for the build-number-lookup step below once that app exists.
      node: latest
      xcode: latest # pin to a specific version (e.g. 15.0) once a build succeeds, to avoid surprise Xcode updates breaking things later
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "master"
          include: true
          source: true
    scripts:
      - name: Install web dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor (copies dist/ into the native iOS project)
        script: |
          npx cap sync ios
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on the Xcode project
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Starts false on purpose -- confirm the .ipa actually builds and
        # signs correctly first, then flip to true once you're ready to
        # have every successful build land in TestFlight automatically.
        submit_to_testflight: false
